<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>installngo — coming soon</title>
  <meta name="description" content="installngo is launching soon. Follow us on Instagram and YouTube.">
  <meta property="og:title" content="installngo — coming soon">
  <meta property="og:description" content="Something new is on its way. Follow us on Instagram and YouTube.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.installngo.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1a33;
      --text: #f4f6fa;
      --muted: #a9b4c6;
      --accent: #e9a21b;
      --line: rgba(255, 255, 255, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--ink);
      color: var(--text);
      font-family: "Schibsted Grotesk", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(100% - 3rem, 960px);
      margin-inline: auto;
      padding-block: 4rem;
    }
    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .brand .dot { color: var(--accent); }
    .label {
      margin: clamp(3rem, 10vh, 6rem) 0 1rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 700;
      max-width: 12ch;
    }
    .lead {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.55;
      max-width: 40ch;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2.5rem;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 48px;
      padding: 0 1.4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: border-color 150ms ease-out, background 150ms ease-out;
    }
    .links a:hover { border-color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    footer {
      width: min(100% - 3rem, 960px);
      margin-inline: auto;
      padding: 1.5rem 0 2rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="brand">install<span class="dot">n</span>go</div>

    <p class="label">Coming soon</p>
    <h1>Something new is on its way.</h1>
    <p class="lead">installngo is getting ready to launch. Follow us to be the first to know.</p>

    <nav class="links" aria-label="Follow installngo">
      <a href="https://www.instagram.com/installngo" target="_blank" rel="noopener">Instagram <span aria-hidden="true">↗</span></a>
      <a href="https://www.youtube.com/@installngo" target="_blank" rel="noopener">YouTube <span aria-hidden="true">↗</span></a>
    </nav>
  </main>

  <footer>
    <span>© 2026 installngo</span>
    <a href="mailto:installngo.official@gmail.com">installngo.official@gmail.com</a>
  </footer>
</body>
</html>
